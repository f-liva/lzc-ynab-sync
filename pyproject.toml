[project]
name = "ynab-sync"
version = "0.1.0"
description = "Periodic YNAB transaction sync from external payment sources"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "apscheduler>=3.10",
    "httpx>=0.28",
    "eth-account>=0.13",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]
